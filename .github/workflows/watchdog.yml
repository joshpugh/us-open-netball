name: Watchdog

# Backup: if the refresh loop ever stops, restart it.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          active=$(gh run list --workflow update.yml --limit 5 --json status \
            --jq '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
          if [ "$active" = "0" ]; then
            echo "Loop not running, starting it"; gh workflow run update.yml --ref main
          else
            echo "Loop is running"
          fi
